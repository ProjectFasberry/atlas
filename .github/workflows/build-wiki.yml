name: Build wiki

on:
  push:
    branches: [main, dev, staging]
    paths:
      - "apps/wiki/**"
      - "pkgs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-wiki.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: Image stage
        type: choice
        options: [prod, staging]
        default: prod

concurrency:
  group: build-wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            stage="${{ inputs.stage }}"
          else
            stage=prod
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          logout: false

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/wiki/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          secrets: |
            npm_token=${{ secrets.NODE_AUTH_TOKEN }}
          tags: |
            ${{ vars.REGISTRY_HOST }}/${{ steps.stage.outputs.stage }}/wiki:latest
            ${{ vars.REGISTRY_HOST }}/${{ steps.stage.outputs.stage }}/wiki:sha-${{ github.sha }}
          cache-from: type=gha,scope=wiki
          cache-to: type=gha,mode=max,scope=wiki

      - name: Push image
        env:
          IMAGE: ${{ vars.REGISTRY_HOST }}/${{ steps.stage.outputs.stage }}/wiki
        run: |
          docker push "$IMAGE:sha-${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Measure the runtime image instead of building the app a second time.
      - name: Measure build size
        if: github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          BUILD_METRICS_TOKEN: ${{ secrets.BUILD_METRICS_TOKEN }}
          BUILD_METRICS_URL: ${{ secrets.BUILD_METRICS_URL }}
          IMAGE: ${{ vars.REGISTRY_HOST }}/${{ steps.stage.outputs.stage }}/wiki:sha-${{ github.sha }}
        run: |
          docker create --name wiki-size "$IMAGE" > /dev/null
          trap 'docker rm -f wiki-size > /dev/null 2>&1 || true' EXIT
          docker cp wiki-size:/app/apps/wiki/.next apps/wiki/.next
          node scripts/build-size.mjs --app wiki --stage ${{ steps.stage.outputs.stage }} --out build-metrics.json
          url="${BUILD_METRICS_URL%/}"
          case "$url" in
            */metrics/build) ;;
            *) url="$url/metrics/build" ;;
          esac
          curl -fsS -X POST "$url" \
            -H "Authorization: Bearer ${BUILD_METRICS_TOKEN}" \
            -H "content-type: application/json" \
            --data @build-metrics.json
