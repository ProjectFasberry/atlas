name: Build wiki

on:
  push:
    branches: [main, dev, staging]
    paths:
      - "apps/wiki/**"
      - "pkgs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-wiki.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: Image stage
        type: choice
        options: [prod, staging]
        default: prod

concurrency:
  group: build-wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            stage="${{ inputs.stage }}"
          else
            stage=prod
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          logout: false

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/wiki/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ steps.stage.outputs.stage == 'prod' && (vars.NEXT_PUBLIC_SITE_URL_PROD || 'https://wiki.fasberry.fun') || (vars.NEXT_PUBLIC_SITE_URL_STAGING || 'https://wiki.fasberry.fun') }}
          secrets: |
            npm_token=${{ secrets.NODE_AUTH_TOKEN }}
          tags: |
            ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}/${{ steps.stage.outputs.stage }}/wiki:latest
            ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}/${{ steps.stage.outputs.stage }}/wiki:sha-${{ github.sha }}
          cache-from: type=gha,scope=wiki
          cache-to: type=gha,mode=max,scope=wiki

  size:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '@projectfasberry:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\nalways-auth=true\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter wiki... --ignore-scripts

      - name: Build
        working-directory: apps/wiki
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL_PROD || 'https://wiki.fasberry.fun' }}
        run: pnpm build

      - name: Measure build size
        continue-on-error: true
        env:
          BUILD_METRICS_TOKEN: ${{ secrets.BUILD_METRICS_TOKEN }}
          BUILD_METRICS_URL: ${{ secrets.BUILD_METRICS_URL }}
        run: |
          node scripts/build-size.mjs --app wiki --stage prod --out build-metrics.json
          if [ -n "${BUILD_METRICS_TOKEN:-}" ]; then
            url="${BUILD_METRICS_URL%/}"
            case "$url" in
              */metrics/build) ;;
              *) url="$url/metrics/build" ;;
            esac
            curl -fsS -X POST "$url" \
              -H "Authorization: Bearer ${BUILD_METRICS_TOKEN}" \
              -H "content-type: application/json" \
              --data @build-metrics.json
          else
            echo "BUILD_METRICS_TOKEN is not set, metrics were not uploaded"
          fi
