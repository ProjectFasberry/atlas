name: Build wiki

on:
  push:
    branches: [main, dev, staging]
    paths:
      - "apps/wiki/**"
      - "pkgs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-wiki.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: Image stage
        type: choice
        options: [prod, staging]
        default: prod

concurrency:
  group: build-wiki-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            stage="${{ inputs.stage }}"
          else
            stage=prod
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          logout: false

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/wiki/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ steps.stage.outputs.stage == 'prod' && (vars.NEXT_PUBLIC_SITE_URL_PROD || 'https://wiki.fasberry.fun') || (vars.NEXT_PUBLIC_SITE_URL_STAGING || 'https://wiki.fasberry.fun') }}
          secrets: |
            npm_token=${{ secrets.NODE_AUTH_TOKEN }}
          tags: |
            ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}/${{ steps.stage.outputs.stage }}/wiki:latest
            ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}/${{ steps.stage.outputs.stage }}/wiki:sha-${{ github.sha }}
          cache-from: type=gha,scope=wiki
          cache-to: type=gha,mode=max,scope=wiki
