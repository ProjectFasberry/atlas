name: Build minotaur

on:
  push:
    branches: [main, dev, staging]
    paths:
      - "apps/minotaur/**"
      - "pkgs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-minotaur.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: Image stage
        type: choice
        options: [prod, staging]
        default: prod

concurrency:
  group: build-minotaur-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            stage="${{ inputs.stage }}"
          else
            stage=prod
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '@projectfasberry:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\nalways-auth=true\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          fi

      - name: Load Infisical build env
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: "universal"
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          domain: https://infisical.fasberry.fun
          env-slug: ${{ steps.stage.outputs.stage }}
          secret-path: /minotaur

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter minotaur... --ignore-scripts

      # The image only contains the runtime; the client bundle is built here,
      # on native amd64. Vite reads the VITE_* values injected by Infisical.
      - name: Build client bundle
        working-directory: apps/minotaur
        run: bun --bun run vike build
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          NODE_ENV: production

      - name: Measure build size
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          BUILD_METRICS_TOKEN: ${{ secrets.BUILD_METRICS_TOKEN }}
        run: |
          node scripts/build-size.mjs --app minotaur --stage ${{ steps.stage.outputs.stage }} --out build-metrics.json
          if [ -n "${BUILD_METRICS_TOKEN:-}" ]; then
            curl -fsS -X POST https://panel.fasberry.fun/metrics/build \
              -H "Authorization: Bearer ${BUILD_METRICS_TOKEN}" \
              -H "content-type: application/json" \
              --data @build-metrics.json
          else
            echo "BUILD_METRICS_TOKEN is not set, metrics were not uploaded"
          fi

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          logout: false

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/minotaur/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            STAGE=${{ steps.stage.outputs.stage }}
          tags: |
            ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}/${{ steps.stage.outputs.stage }}/minotaur:latest
            ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}/${{ steps.stage.outputs.stage }}/minotaur:sha-${{ github.sha }}
          cache-from: type=gha,scope=minotaur
          cache-to: type=gha,mode=max,scope=minotaur
