name: Build minotaur

on:
  push:
    branches: [main, dev, staging]
    paths:
      - "apps/minotaur/**"
      - "pkgs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/workflows/build-minotaur.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: Image stage
        type: choice
        options: [prod, staging, dev]
        default: prod

concurrency:
  group: build-minotaur-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            stage="${{ inputs.stage }}"
          else
            case "${{ github.ref_name }}" in
              main) stage=prod ;;
              staging) stage=staging ;;
              *) stage=dev ;;
            esac
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@projectfasberry"
          always-auth: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      # Public build-time config for the client bundle: Vite inlines VITE_* at
      # build time. Defaults below are the live prod values; staging and dev use
      # the alpha hosts. Repository variables of the same name override them.
      - name: Resolve build env
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_PANEL_API_URL: ${{ vars.VITE_PANEL_API_URL }}
          VITE_APP_PORT: ${{ vars.VITE_APP_PORT }}
          VITE_LANDING_URL: ${{ vars.VITE_LANDING_URL }}
          VITE_MAIN_DOMAIN: ${{ vars.VITE_MAIN_DOMAIN }}
          VITE_VOLUME_URL: ${{ vars.VITE_VOLUME_URL }}
          VITE_CAP_URL: ${{ vars.VITE_CAP_URL }}
          VITE_CAP_SITE_KEY: ${{ vars.VITE_CAP_SITE_KEY }}
          VITE_APAY_TAG: ${{ vars.VITE_APAY_TAG }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          case "$STAGE" in
            prod) suffix="" ;;
            *) suffix=".alpha" ;;
          esac
          {
            echo "VITE_API_URL=${VITE_API_URL:-https://api$suffix.fasberry.fun}"
            echo "VITE_APP_URL=${VITE_APP_URL:-https://app$suffix.fasberry.fun}"
            echo "VITE_PANEL_API_URL=${VITE_PANEL_API_URL:-https://panel$suffix.fasberry.fun}"
            echo "VITE_APP_PORT=${VITE_APP_PORT:-3003}"
            echo "VITE_LANDING_URL=${VITE_LANDING_URL:-https://fasberry.fun}"
            echo "VITE_MAIN_DOMAIN=${VITE_MAIN_DOMAIN:-fasberry.fun}"
            echo "VITE_VOLUME_URL=${VITE_VOLUME_URL:-https://volume.fasberry.fun}"
            echo "VITE_CAP_URL=${VITE_CAP_URL:-https://cap.fasberry.fun}"
            echo "VITE_CAP_SITE_KEY=${VITE_CAP_SITE_KEY:-4162fef8d7}"
            echo "VITE_APAY_TAG=${VITE_APAY_TAG:-JPL64OYWY72V7HGNB2I44C5TCCVBKXQM}"
            echo "VITE_SENTRY_DSN=${VITE_SENTRY_DSN-}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter minotaur... --ignore-scripts

      - name: Test
        run: pnpm --filter minotaur test

      # The image only contains the runtime; the client bundle is built here,
      # on native amd64. Vite reads the VITE_* values resolved above.
      - name: Build client bundle
        working-directory: apps/minotaur
        run: bun --bun run vike build
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          NODE_ENV: production

      - name: Measure build size
        if: github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          BUILD_METRICS_TOKEN: ${{ secrets.BUILD_METRICS_TOKEN }}
          BUILD_METRICS_URL: ${{ secrets.BUILD_METRICS_URL }}
        run: |
          node scripts/build-size.mjs --app minotaur --stage ${{ steps.stage.outputs.stage }} --out build-metrics.json
          url="${BUILD_METRICS_URL%/}"
          case "$url" in
            */metrics/build) ;;
            *) url="$url/metrics/build" ;;
          esac
          curl -fsS -X POST "$url" \
            -H "Authorization: Bearer ${BUILD_METRICS_TOKEN}" \
            -H "content-type: application/json" \
            --data @build-metrics.json

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          logout: false

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/minotaur/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            STAGE=${{ steps.stage.outputs.stage }}
          tags: |
            ${{ vars.REGISTRY_HOST }}/${{ steps.stage.outputs.stage }}/minotaur:latest
            ${{ vars.REGISTRY_HOST }}/${{ steps.stage.outputs.stage }}/minotaur:sha-${{ github.sha }}
          cache-from: type=gha,scope=minotaur
          cache-to: type=gha,mode=max,scope=minotaur
      - name: Notify glaux (Telegram + Gotify) about the pushed image
        continue-on-error: true
        env:
          ALERT_URL: ${{ vars.ALERT_URL || 'https://panel.fasberry.fun/internal/alerts' }}
          ALERT_KEY: ${{ secrets.ALERT_KEY }}
          STAGE: ${{ steps.stage.outputs.stage }}
          APP: minotaur
        run: |
          [ -n "$ALERT_KEY" ] || { echo "ALERT_KEY is not set; skipping"; exit 0; }
          TITLE="image pushed: ${STAGE}/${APP}"
          MESSAGE=$(printf 'image: %s/%s:latest\ncommit: %s\nby: %s\nrun: https://github.com/%s/actions/runs/%s' \
            "$STAGE" "$APP" "${GITHUB_SHA:0:7}" "$GITHUB_ACTOR" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          payload=$(python3 -c 'import json,sys; print(json.dumps({"from":"ci","title":sys.argv[1],"message":sys.argv[2],"severity":"info"}))' "$TITLE" "$MESSAGE")
          curl -fsS -X POST "$ALERT_URL" \
            -H "Authorization: Bearer $ALERT_KEY" \
            -H "content-type: application/json" \
            --data "$payload"
