name: Build minotaur

on:
  push:
    branches: [main, dev, staging]
    paths:
      - "apps/minotaur/**"
      - "pkgs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-minotaur.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: Image stage
        type: choice
        options: [prod, staging]
        default: prod

concurrency:
  group: build-minotaur-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux, x64, fasberry]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            stage="${{ inputs.stage }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            stage=prod
          else
            stage=staging
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '@projectfasberry:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\nalways-auth=true\n' "$NODE_AUTH_TOKEN" > "$HOME/.npmrc"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter minotaur... --ignore-scripts

      # The image only contains the runtime; the client bundle is built here,
      # on native amd64. The per-stage URLs are baked into the bundle by Vite.
      - name: Build client bundle
        working-directory: apps/minotaur
        run: bun --bun run vike build
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          NODE_ENV: production
          VITE_API_URL: ${{ steps.stage.outputs.stage == 'prod' && (vars.VITE_API_URL_PROD || 'https://api.fasberry.fun') || (vars.VITE_API_URL_STAGING || 'https://api.alpha.fasberry.fun') }}
          VITE_APP_URL: ${{ steps.stage.outputs.stage == 'prod' && (vars.VITE_APP_URL_PROD || 'https://app.fasberry.fun') || (vars.VITE_APP_URL_STAGING || 'https://app.alpha.fasberry.fun') }}
          VITE_PANEL_API_URL: ${{ steps.stage.outputs.stage == 'prod' && (vars.VITE_PANEL_API_URL_PROD || 'https://panel.fasberry.fun') || (vars.VITE_PANEL_API_URL_STAGING || 'https://panel.alpha.fasberry.fun') }}
          VITE_LANDING_URL: ${{ vars.VITE_LANDING_URL || 'https://fasberry.fun' }}
          VITE_VOLUME_URL: ${{ vars.VITE_VOLUME_URL || 'https://volume.fasberry.fun' }}
          VITE_MAIN_DOMAIN: ${{ vars.VITE_MAIN_DOMAIN || 'fasberry.fun' }}
          VITE_APP_PORT: ${{ vars.VITE_APP_PORT || '3003' }}
          VITE_CAP_URL: ${{ vars.VITE_CAP_URL || 'https://cap.fasberry.fun' }}
          VITE_CAP_SITE_KEY: ${{ vars.VITE_CAP_SITE_KEY }}
          VITE_APAY_TAG: ${{ vars.VITE_APAY_TAG }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          builder: fasberry
          context: .
          file: apps/minotaur/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            STAGE=${{ steps.stage.outputs.stage }}
          tags: |
            ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}/${{ steps.stage.outputs.stage }}/minotaur:latest
            ${{ vars.REGISTRY_HOST || 'registry.fasberry.fun' }}/${{ steps.stage.outputs.stage }}/minotaur:sha-${{ github.sha }}
          cache-from: type=gha,scope=minotaur
          cache-to: type=gha,mode=max,scope=minotaur
