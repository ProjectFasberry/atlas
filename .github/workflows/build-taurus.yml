name: Build taurus

on:
  push:
    branches: [main]
    paths:
      - "apps/taurus/**"
      - "pkgs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-taurus.yml"
  workflow_dispatch:
    inputs:
      stage:
        description: Image stage
        type: choice
        options: [prod]
        default: prod

concurrency:
  group: build-taurus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Self-hosted: the image is pushed to the local registry over loopback;
    # GitHub-hosted runners cannot upload large layers over the home uplink.
    runs-on: [self-hosted, linux, x64, fasberry]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve stage
        id: stage
        run: |
          # Only the production stage is deployed until the first paying client.
          echo "stage=prod" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      # Taurus needs module.registerHooks (Node >= 22.15); .nvmrc pins an older 22.x.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@projectfasberry"
          always-auth: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      # Public build-time config for the client bundle: Vite inlines VITE_* and
      # PUBLIC_ENV__* at build time. Defaults below are the live prod values;
      # staging and dev use the alpha hosts. Repository variables of the same
      # name override them.
      - name: Resolve build env
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_VOLUME_URL: ${{ vars.VITE_VOLUME_URL }}
          VITE_MAIN_DOMAIN: ${{ vars.VITE_MAIN_DOMAIN }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_LANDING_ENDPOINT: ${{ vars.VITE_LANDING_ENDPOINT }}
          PUBLIC_ENV__API_URL: ${{ vars.PUBLIC_ENV__API_URL }}
          PUBLIC_ENV__TG_NAME: ${{ vars.PUBLIC_ENV__TG_NAME }}
        run: |
          case "$STAGE" in
            prod) suffix="" ;;
            *) suffix=".alpha" ;;
          esac
          {
            echo "VITE_APP_URL=${VITE_APP_URL:-https://app$suffix.fasberry.fun}"
            echo "VITE_API_URL=${VITE_API_URL:-https://api$suffix.fasberry.fun}"
            echo "PUBLIC_ENV__API_URL=${PUBLIC_ENV__API_URL:-https://api$suffix.fasberry.fun}"
            echo "VITE_VOLUME_URL=${VITE_VOLUME_URL:-https://volume.fasberry.fun}"
            echo "VITE_MAIN_DOMAIN=${VITE_MAIN_DOMAIN:-fasberry.fun}"
            echo "VITE_SUPPORT_EMAIL=${VITE_SUPPORT_EMAIL:-support@fasberry.fun}"
            echo "VITE_LANDING_ENDPOINT=${VITE_LANDING_ENDPOINT:-https://fasberry.fun}"
            echo "PUBLIC_ENV__TG_NAME=${PUBLIC_ENV__TG_NAME:-fasberry}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter taurus... --ignore-scripts

      # The image only contains the runtime; the client bundle is built here,
      # on native amd64. Vite reads the env resolved above.
      - name: Build client bundle
        working-directory: apps/taurus
        # node, not bun: the rolldown adapter needs module.registerHooks, which
        # bun's node:module shim does not export.
        run: pnpm exec vike build
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          NODE_ENV: production
          # Self-hosted runtime: no Cloudflare plugin, plain Node server entry.
          DEPLOY_TARGET: node

      - name: Measure build size
        if: github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          BUILD_METRICS_TOKEN: ${{ secrets.BUILD_METRICS_TOKEN }}
          BUILD_METRICS_URL: ${{ secrets.BUILD_METRICS_URL }}
        run: |
          node scripts/build-size.mjs --app taurus --stage ${{ steps.stage.outputs.stage }} --out build-metrics.json
          url="${BUILD_METRICS_URL%/}"
          case "$url" in
            */metrics/build) ;;
            *) url="$url/metrics/build" ;;
          esac
          curl -fsS -X POST "$url" \
            -H "Authorization: Bearer ${BUILD_METRICS_TOKEN}" \
            -H "content-type: application/json" \
            --data @build-metrics.json

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          logout: false

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/taurus/Dockerfile
          builder: fasberry
          platforms: linux/amd64
          push: true
          build-args: |
            STAGE=${{ steps.stage.outputs.stage }}
          tags: |
            ${{ vars.REGISTRY_HOST }}/${{ steps.stage.outputs.stage }}/taurus:latest
            ${{ vars.REGISTRY_HOST }}/${{ steps.stage.outputs.stage }}/taurus:sha-${{ github.sha }}
          cache-from: type=gha,scope=taurus
          cache-to: type=gha,mode=max,scope=taurus
      - name: Notify glaux (Telegram + Gotify) about the pushed image
        continue-on-error: true
        env:
          ALERT_URL: ${{ vars.ALERT_URL || 'https://panel.fasberry.fun/internal/alerts' }}
          ALERT_KEY: ${{ secrets.ALERT_KEY }}
          STAGE: ${{ steps.stage.outputs.stage }}
          APP: taurus
        run: |
          [ -n "$ALERT_KEY" ] || { echo "ALERT_KEY is not set; skipping"; exit 0; }
          TITLE="image pushed: ${STAGE}/${APP}"
          MESSAGE=$(printf 'image: %s/%s:latest\ncommit: %s\nby: %s\nrun: https://github.com/%s/actions/runs/%s' \
            "$STAGE" "$APP" "${GITHUB_SHA:0:7}" "$GITHUB_ACTOR" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          payload=$(python3 -c 'import json,sys; print(json.dumps({"from":"ci","title":sys.argv[1],"message":sys.argv[2],"severity":"info"}))' "$TITLE" "$MESSAGE")
          curl -fsS -X POST "$ALERT_URL" \
            -H "Authorization: Bearer $ALERT_KEY" \
            -H "content-type: application/json" \
            --data "$payload"
